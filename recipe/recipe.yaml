context:
  version: "2.1.2"

package:
  name: ultralytics-thop
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/u/ultralytics-thop/ultralytics_thop-${{ version }}.tar.gz
    sha256: c8b6f6585bf2ec0b2532234a9c705dda03a870a3471e2303f0fee206be37754e

build:
  number: 0
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=70.0.0
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - pytorch

tests:
  - python:
      imports:
        - thop
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Ultralytics THOP package for fast computation of PyTorch model FLOPs and parameters.
  homepage: https://github.com/ultralytics/thop
  license: AGPL-3.0-only
  license_file: LICENSE
  documentation: https://docs.ultralytics.com

extra:
  recipe-maintainers:
    - glenn-jocher
    - carlodri
